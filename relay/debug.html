<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Beacon debug</title>
  <style>
    :root { --bg: #111; --fg: #eee; --muted: #888; --line: #333; --nominal: #2e7d32; --warning: #b26a00; --storm: #b71c1c; }
    body { background: var(--bg); color: var(--fg); font: 15px system-ui, sans-serif; margin: 0; padding: 16px; }
    h1 { font-size: 20px; margin: 0 0 12px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
    .pill { font-size: 13px; padding: 2px 10px; border-radius: 999px; background: var(--line); }
    .grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px; }
    @media (max-width: 760px) { .grid { grid-template-columns: 1fr; } }
    section { border: 1px solid var(--line); border-radius: 8px; padding: 12px; }
    h2 { font-size: 14px; color: var(--muted); margin: 0 0 8px; text-transform: uppercase; letter-spacing: .05em; }
    pre { margin: 0; font: 13px ui-monospace, monospace; white-space: pre-wrap; word-break: break-word; }
    .buttons { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 8px; }
    button, input { font: inherit; padding: 8px 12px; border-radius: 6px; border: 1px solid var(--line); background: #222; color: var(--fg); }
    button:hover { background: #2c2c2c; }
    button.danger { border-color: var(--storm); }
    input { width: 5em; }
    ul { margin: 0; padding-left: 20px; }
    .muted { color: var(--muted); }
  </style>
</head>
<body>
  <h1>Beacon debug <span id="conn" class="pill">connecting</span> <span id="mode" class="pill">-</span></h1>

  <div class="grid">
    <section>
      <h2>Events</h2>
      <div class="buttons">
        <button data-ev='{"type":"back"}'>back</button>
        <button data-ev='{"type":"next"}'>next</button>
        <input id="gotoIndex" type="number" min="0" value="0" aria-label="goto index">
        <button id="goto">goto</button>
      </div>
      <div class="buttons">
        <button class="danger" data-ev='{"type":"storm","on":true}'>storm on</button>
        <button data-ev='{"type":"storm","on":false}'>storm off</button>
        <button class="danger" data-ev='{"type":"panic"}'>panic</button>
        <button data-ev='{"type":"requestReroute"}'>requestReroute</button>
      </div>
      <div class="buttons">
        <button data-ev='{"type":"reset"}'>reset</button>
        <button data-ev='{"type":"hello","role":"debug"}'>hello</button>
      </div>
      <p id="sent" class="muted"></p>

      <h2>Connected</h2>
      <ul id="clients"><li class="muted">-</li></ul>
    </section>

    <section>
      <h2>State</h2>
      <pre id="state">waiting for relay…</pre>
    </section>
  </div>

  <script type="module">
    import { connect } from '/shared/client.js';

    const $ = (id) => document.getElementById(id);
    const colours = { nominal: 'var(--nominal)', warning: 'var(--warning)', storm: 'var(--storm)' };

    const relay = connect({
      role: 'debug',
      onState(state) {
        $('state').textContent = JSON.stringify(state, null, 2);
        $('mode').textContent = state.mode;
        $('mode').style.background = colours[state.mode] || '';
      },
      onStatus(ok) {
        $('conn').textContent = ok ? 'connected' : 'reconnecting';
        $('conn').style.background = ok ? 'var(--nominal)' : 'var(--storm)';
      },
    });

    function send(ev) {
      $('sent').textContent = (relay.send(ev) ? 'sent ' : 'NOT SENT (offline) ') + JSON.stringify(ev);
    }

    for (const b of document.querySelectorAll('button[data-ev]')) {
      b.addEventListener('click', () => send(JSON.parse(b.dataset.ev)));
    }
    $('goto').addEventListener('click', () => send({ type: 'goto', index: parseInt($('gotoIndex').value, 10) || 0 }));

    async function refreshClients() {
      try {
        const list = await (await fetch('/clients', { cache: 'no-store' })).json();
        $('clients').innerHTML = '';
        for (const c of list) {
          const li = document.createElement('li');
          li.textContent = `${c.role} (${c.transport}, ${c.address})`;
          $('clients').append(li);
        }
        if (!list.length) $('clients').innerHTML = '<li class="muted">none</li>';
      } catch { /* relay down; the status pill already says so */ }
    }
    refreshClients();
    setInterval(refreshClients, 2000);
  </script>
</body>
</html>
