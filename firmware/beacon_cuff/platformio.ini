; Beacon cuff: ESP32-S3 wrist cuff on the relay's plain WebSocket (port 8081).
; Build and flash:  pio run -t upload      Serial monitor:  pio device monitor
[env:esp32-s3]
platform = espressif32@6.9.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
build_flags =
  -D ARDUINO_USB_CDC_ON_BOOT=1
  -D ARDUINO_USB_MODE=1
lib_deps =
  links2004/WebSockets@2.6.1
  bblanchon/ArduinoJson@7.2.1
