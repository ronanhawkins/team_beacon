<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#04060a">
  <meta name="mobile-web-app-capable" content="yes">
  <title>Beacon Wrist</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="./style.css">
</head>
<body class="offline">
  <main class="wrist">
    <section class="map" aria-label="Map with your position">
      <canvas id="map"></canvas>
      <div class="mapTop">
        <span class="brand">BEACON</span>
        <span id="link" class="link"><i></i><span>No link</span></span>
      </div>
      <div class="north" aria-hidden="true">N</div>
      <div id="scale" class="scale" aria-hidden="true"><i></i><span></span></div>
      <button id="addWp" class="addWp" type="button" disabled>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-6-5.6-6-11a6 6 0 0 1 12 0c0 5.4-6 11-6 11z"/><path d="M12 7v6M9 10h6"/></svg>
        <span>Waypoint</span>
      </button>
      <div id="placeHint" class="placeHint" hidden>Tap the map to move the waypoint</div>
      <div class="zoom">
        <button id="zoomIn" type="button" aria-label="Zoom in">+</button>
        <button id="zoomOut" type="button" aria-label="Zoom out">−</button>
      </div>
    </section>

    <aside class="side">
      <header class="status" aria-live="polite">
        <svg class="pip" viewBox="0 0 40 40" aria-hidden="true"><circle class="track" cx="20" cy="20" r="17"/><circle class="glow" cx="20" cy="20" r="17"/><circle class="core" cx="20" cy="20" r="5"/></svg>
        <div>
          <span id="kicker" class="kicker">Status</span>
          <strong id="title" class="title">Connecting</strong>
        </div>
        <time id="clock" class="clock">--:--</time>
      </header>
      <p id="detail" class="detail">Looking for the base relay</p>

      <div class="next">
        <span class="kicker muted" id="nextKicker">Next</span>
        <span id="nextName" class="nextName">--</span>
        <div id="prog" class="prog" aria-hidden="true"><i class="done"></i></div>
      </div>

      <div id="addActions" class="actions" aria-label="Add a waypoint" hidden>
        <button id="addConfirm" class="act add" type="button" data-hold="700">
          <span class="fill" aria-hidden="true"></span>
          <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-6-5.6-6-11a6 6 0 0 1 12 0c0 5.4-6 11-6 11z"/><path d="M12 7v6M9 10h6"/></svg>
          <span class="lbl"><b>Add to route</b><small>Hold to add</small></span>
        </button>
        <button id="addCancel" class="act ghost" type="button">
          <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
          <span class="lbl"><b>Cancel</b><small>Keep the route</small></span>
        </button>
      </div>
      <div id="mainActions" class="actions" aria-label="Reroute options">
        <button id="reroute" class="act" type="button" data-hold="900" disabled>
          <span class="fill" aria-hidden="true"></span>
          <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20L12 4l8 16-8-4z"/></svg>
          <span class="lbl"><b>Go to shelter</b><small>Hold to reroute</small></span>
        </button>
        <button id="sos" class="act sos" type="button" data-hold="1500" disabled>
          <span class="fill" aria-hidden="true"></span>
          <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3L2 20h20z"/><path d="M12 10v4M12 17v.5"/></svg>
          <span class="lbl"><b>SOS</b><small>Hold to alert base</small></span>
        </button>
      </div>
      <p id="note" class="note" role="status"></p>
    </aside>
  </main>
  <button id="landscape" class="landscape" type="button" hidden>Tap for full screen, landscape</button>
  <script type="module" src="./main.js"></script>
</body>
</html>
